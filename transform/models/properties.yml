  - name: int_reported_cash_flow_metrics
    description: One agreed reported operating-cash-flow or PP&E acquisition-payment value per CIK, accession, metric and exact duration; all supporting occurrences remain traceable.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_financial_metric_candidates')
                field: source_occurrence_id
      - name: raw_value
        description: Original tagged numeric text, including the supplied sign; no display or sign normalization.
      - name: value_decimal
        description: Exact representative DECIMAL(38,18), selected only after every eligible value and accuracy attribute agrees.
        data_tests: [not_null]
      - name: supporting_occurrence_ids
        description: All eligible IDs ordered by concept priority, source ordinal and occurrence ID, including the representative.
        data_tests: [not_null]
      - name: supporting_occurrence_count
        data_tests: [not_null]
      - name: period_label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reported_duration]
      - name: selection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SINGLE_ELIGIBLE_OCCURRENCE, AGREEING_ELIGIBLE_OCCURRENCES]
      - name: selection_rule_version
        description: Version of the eligibility, agreement and representative rules.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: form
        description: Verified form; original and amended accessions stay separate.
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: report_date
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [operating_cash_flow, capital_expenditures]
      - name: period_start
        data_tests: [not_null]
      - name: period_end
        data_tests: [not_null]
  - name: int_cash_flow_metric_selection_issues
    description: One precedence-ordered filing and metric problem or one ambiguity per exact eligible cash-flow duration; excluded candidates remain inspectable.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [operating_cash_flow, capital_expenditures]
      - name: issue_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MISSING_FILING_METADATA, UNSUPPORTED_FORM, MISSING_REPORT_DATE, NO_ELIGIBLE_METRIC, METRIC_VALUE_CONFLICT, METRIC_ACCURACY_UNRESOLVED]
      - name: severity
        description: Metadata or report-date absence is ERROR; unsupported forms and supplemental metric problems are WARNING.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ERROR, WARNING]
      - name: report_date
        description: Verified date when available; null is allowed.
      - name: period_start
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: period_end
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: source_occurrence_ids
        description: Eligible ambiguity IDs in representative order, or a typed empty array for filing and metric problems.
        data_tests: [not_null]
      - name: details
        data_tests: [not_null]


  - name: stg_silver_filing_fiscal_metadata
    description: Version 1 fiscal DEI evidence for the exact active source; complete and partial results
      remain inspectable.
    columns:
    - name: cik
      data_tests:
      - not_null
    - name: accession_number
      data_tests:
      - not_null
    - name: source_document_name
      data_tests:
      - not_null
    - name: source_sha256
      data_tests:
      - not_null
    - name: extraction_version
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - '1'
    - name: form
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - 10-K
            - 10-K/A
            - 10-Q
            - 10-Q/A
    - name: report_date
      data_tests:
      - not_null
    - name: metadata_run_id
      data_tests:
      - not_null
    - name: submissions_sha256
      data_tests:
      - not_null
    - name: extraction_status
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - COMPLETE
            - PARTIAL
    - name: fiscal_year_focus
    - name: fiscal_period_focus
      data_tests:
      - accepted_values:
          arguments:
            values:
            - FY
            - Q1
            - Q2
            - Q3
    - name: document_period_end_date
    - name: occurrences_json
      data_tests:
      - not_null
    - name: issues_json
      data_tests:
      - not_null

  - name: int_reported_financial_periods
    description: All selected metrics with their original 40-column evidence and V1 reported-period
      classification; unusual or competing periods remain visible as unclassified.
    columns:
      - name: value_decimal
        description: Unchanged selected DECIMAL(38,18), including diluted EPS.
      - name: fiscal_year_focus
        data_type: INTEGER
        description: Reported DEI fiscal year; never inferred from a calendar date.
      - name: fiscal_period_focus
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: [FY, Q1, Q2, Q3]
      - name: document_period_end_date
        data_type: DATE
      - name: fiscal_metadata_status
        data_type: VARCHAR
        description: Retained extraction status; PARTIAL can supply usable resolved fiscal fields.
        data_tests:
          - accepted_values:
              arguments:
                values: [COMPLETE, PARTIAL]
      - name: fiscal_extraction_version
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: ['1']
      - name: fiscal_metadata_run_id
        data_type: VARCHAR
      - name: fiscal_submissions_sha256
        data_type: VARCHAR
      - name: period_classification
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [annual, quarter, year_to_date, instant, unclassified]
      - name: period_rule_version
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: period_classification_reason
        data_type: VARCHAR
        data_tests: [not_null]
      - name: period_issue_code
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: [INVALID_REPORTED_PERIOD, MISSING_FISCAL_METADATA,
                  FISCAL_METADATA_LINEAGE_MISMATCH, UNRESOLVED_FISCAL_METADATA,
                  FISCAL_REPORT_DATE_MISMATCH, FISCAL_PERIOD_FORM_MISMATCH,
                  UNSUPPORTED_DURATION, AMBIGUOUS_REPORTED_PERIOD]

seeds:
  - name: metric_concept_map
    description: Approved revenue, income, balance-sheet and cash-flow concept mappings; one row per metric, namespace prefix, concept and period kind. Priority is evidence for later selection.
    columns:
      - name: metric_code
        data_tests: [not_null]
      - name: concept_namespace_prefix
        data_tests: [not_null]
      - name: concept_local_name
        data_tests: [not_null]
      - name: concept_priority
        data_tests: [not_null]
      - name: expected_period_kind
        data_tests: [not_null]
