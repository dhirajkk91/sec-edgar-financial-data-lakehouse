unit_tests:
- name: equal_values_keep_occurrences_and_dimensions_do_not_multiply
  model: int_financial_metric_candidates
  description: Equal values remain separate; two dimensions belong to one occurrence.
  given:
  - input: ref('stg_silver_facts')
    rows:
    - cik: 0000320193
      accession_number: 0000320193-25-000001
      source_document_name: filing.xml
      source_sha256: checksum
      concept_namespace: http://fasb.org/us-gaap/2025
      concept_local_name: RevenueFromContractWithCustomerExcludingAssessedTax
      value_decimal: '100.000000000000000001'
      is_nil: false
      unit_expression: '{http://www.xbrl.org/2003/iso4217}USD'
      period_kind: DURATION
      period_start: '2025-01-01'
      period_end: '2025-03-31'
      source_occurrence_id: equal-a
    - cik: 0000320193
      accession_number: 0000320193-25-000001
      source_document_name: filing.xml
      source_sha256: checksum
      concept_namespace: http://fasb.org/us-gaap/2025
      concept_local_name: RevenueFromContractWithCustomerExcludingAssessedTax
      value_decimal: '100.000000000000000001'
      is_nil: false
      unit_expression: '{http://www.xbrl.org/2003/iso4217}USD'
      period_kind: DURATION
      period_start: '2025-01-01'
      period_end: '2025-03-31'
      source_occurrence_id: equal-b
  - input: ref('stg_silver_active_filings')
    rows:
    - cik: 0000320193
      accession_number: 0000320193-25-000001
      source_document_name: filing.xml
      source_sha256: checksum
  - input: ref('metric_concept_map')
    rows:
    - metric_code: revenue
      concept_namespace_prefix: http://fasb.org/us-gaap/
      concept_local_name: RevenueFromContractWithCustomerExcludingAssessedTax
      concept_priority: 1
      expected_period_kind: duration
    - metric_code: revenue
      concept_namespace_prefix: http://fasb.org/us-gaap/
      concept_local_name: SalesRevenueNet
      concept_priority: 2
      expected_period_kind: duration
    - metric_code: revenue
      concept_namespace_prefix: http://fasb.org/us-gaap/
      concept_local_name: Revenues
      concept_priority: 3
      expected_period_kind: duration
  - input: ref('stg_silver_fact_dimensions')
    rows:
    - source_occurrence_id: equal-a
      axis_name: ProductAxis
    - source_occurrence_id: equal-a
      axis_name: GeographyAxis
  expect:
    rows:
    - source_occurrence_id: equal-a
      value_decimal: '100.000000000000000001'
      dimension_count: 2
      has_dimensions: true
      duration_days: 90
      is_usd: true
    - source_occurrence_id: equal-b
      value_decimal: '100.000000000000000001'
      dimension_count: 0
      has_dimensions: false
      duration_days: 90
      is_usd: true
