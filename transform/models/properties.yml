      - name: report_date
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [operating_cash_flow, capital_expenditures]
      - name: period_start
        data_tests: [not_null]
      - name: period_end
        data_tests: [not_null]
  - name: int_cash_flow_metric_selection_issues
    description: One precedence-ordered filing and metric problem or one ambiguity per exact eligible cash-flow duration; excluded candidates remain inspectable.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [operating_cash_flow, capital_expenditures]
      - name: issue_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MISSING_FILING_METADATA, UNSUPPORTED_FORM, MISSING_REPORT_DATE, NO_ELIGIBLE_METRIC, METRIC_VALUE_CONFLICT, METRIC_ACCURACY_UNRESOLVED]
      - name: severity
        description: Metadata or report-date absence is ERROR; unsupported forms and supplemental metric problems are WARNING.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ERROR, WARNING]
      - name: report_date
        description: Verified date when available; null is allowed.
      - name: period_start
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: period_end
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: source_occurrence_ids
        description: Eligible ambiguity IDs in representative order, or a typed empty array for filing and metric problems.
        data_tests: [not_null]
      - name: details
        data_tests: [not_null]


  - name: stg_silver_filing_fiscal_metadata
    description: Version 1 fiscal DEI evidence for the exact active source; complete and partial results
      remain inspectable.
    columns:
    - name: cik
      data_tests:
      - not_null
    - name: accession_number
      data_tests:
      - not_null
    - name: source_document_name
      data_tests:
      - not_null
    - name: source_sha256
      data_tests:
      - not_null
    - name: extraction_version
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - '1'
    - name: form
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - 10-K
            - 10-K/A
            - 10-Q
            - 10-Q/A
    - name: report_date
      data_tests:
      - not_null
    - name: metadata_run_id
      data_tests:
      - not_null
    - name: submissions_sha256
      data_tests:
      - not_null
    - name: extraction_status
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - COMPLETE
            - PARTIAL
    - name: fiscal_year_focus
    - name: fiscal_period_focus
      data_tests:
      - accepted_values:
          arguments:
            values:
            - FY
            - Q1
            - Q2
            - Q3
    - name: document_period_end_date
    - name: occurrences_json
      data_tests:
      - not_null
    - name: issues_json
      data_tests:
      - not_null

  - name: int_reported_financial_periods
    description: All selected metrics with their original 40-column evidence and V1 reported-period
      classification; unusual or competing periods remain visible as unclassified.
    columns:
      - name: value_decimal
        description: Unchanged selected DECIMAL(38,18), including diluted EPS.
      - name: fiscal_year_focus
        data_type: INTEGER
        description: Reported DEI fiscal year; never inferred from a calendar date.
      - name: fiscal_period_focus
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: [FY, Q1, Q2, Q3]
      - name: document_period_end_date
        data_type: DATE
      - name: fiscal_metadata_status
        data_type: VARCHAR
        description: Retained extraction status; PARTIAL can supply usable resolved fiscal fields.
        data_tests:
          - accepted_values:
              arguments:
                values: [COMPLETE, PARTIAL]
      - name: fiscal_extraction_version
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: ['1']
      - name: fiscal_metadata_run_id
        data_type: VARCHAR
      - name: fiscal_submissions_sha256
        data_type: VARCHAR
      - name: period_classification
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [annual, quarter, year_to_date, instant, unclassified]
      - name: period_rule_version
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: period_classification_reason
        data_type: VARCHAR
        data_tests: [not_null]
      - name: period_issue_code
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: [INVALID_REPORTED_PERIOD, MISSING_FISCAL_METADATA,
                  FISCAL_METADATA_LINEAGE_MISMATCH, UNRESOLVED_FISCAL_METADATA,
                  FISCAL_REPORT_DATE_MISMATCH, FISCAL_PERIOD_FORM_MISMATCH,
                  UNSUPPORTED_DURATION, AMBIGUOUS_REPORTED_PERIOD]

  - name: int_derived_quarterly_cash_flow
    description: Standalone Q2/Q3 supplemental cash flow from one compatible cumulative pair; keeps both inputs and their independent accuracy evidence.
    columns:
      - name: cik
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: accession_number
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: metric_code
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["operating_cash_flow", "capital_expenditures"]
      - name: form
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["10-Q", "10-Q/A"]
      - name: filing_date
        data_type: DATE
        data_tests:
          - not_null
      - name: report_date
        data_type: DATE
        data_tests:
          - not_null
      - name: fiscal_year_focus
        data_type: INTEGER
        data_tests:
          - not_null
      - name: fiscal_period_focus
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Q2", "Q3"]
      - name: period_kind
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["duration"]
      - name: period_start
        data_type: DATE
        data_tests:
          - not_null
      - name: period_end
        data_type: DATE
        data_tests:
          - not_null
      - name: period_instant
        data_type: DATE
      - name: period_label
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["derived_quarter"]
      - name: value_origin
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["derived"]
      - name: value_decimal
        data_type: DECIMAL(38,18)
        data_tests:
          - not_null
      - name: unit_expression
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["{http://www.xbrl.org/2003/iso4217}USD"]
      - name: derivation_rule_version
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1"]
      - name: derivation_method
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CURRENT_YTD_MINUS_PREVIOUS_CUMULATIVE"]
      - name: current_source_occurrence_id
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: current_source_document_name
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: current_source_sha256
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: current_value_decimal
        data_type: DECIMAL(38,18)
        data_tests:
          - not_null
      - name: current_supporting_occurrence_ids
        data_type: VARCHAR[]
        data_tests:
          - not_null
      - name: previous_accession_number
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: previous_source_occurrence_id
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: previous_source_document_name
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: previous_source_sha256
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: previous_value_decimal
        data_type: DECIMAL(38,18)
        data_tests:
          - not_null
      - name: previous_supporting_occurrence_ids
        data_type: VARCHAR[]
        data_tests:
          - not_null
      - name: cumulative_period_start
        data_type: DATE
        data_tests:
          - not_null
      - name: previous_period_end
        data_type: DATE
        data_tests:
          - not_null
      - name: current_decimals
