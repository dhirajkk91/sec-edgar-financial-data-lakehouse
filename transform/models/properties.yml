      - name: value_decimal
        description: Exact representative DECIMAL(38,18), selected only after every eligible value and accuracy attribute agrees.
        data_tests: [not_null]
      - name: supporting_occurrence_ids
        description: All eligible IDs ordered by concept priority, source ordinal and occurrence ID, including the representative.
        data_tests: [not_null]
      - name: supporting_occurrence_count
        data_tests: [not_null]
      - name: period_label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reported_duration]
      - name: selection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SINGLE_ELIGIBLE_OCCURRENCE, AGREEING_ELIGIBLE_OCCURRENCES]
      - name: selection_rule_version
        description: Version of the eligibility, agreement and representative rules.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: form
        description: Verified form; original and amended accessions stay separate.
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: report_date
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [net_income, diluted_eps]
      - name: period_start
        data_tests: [not_null]
      - name: period_end
        data_tests: [not_null]
  - name: int_income_metric_selection_issues
    description: One precedence-ordered filing and metric problem or one ambiguity per exact eligible income-metric duration; excluded candidates remain inspectable.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [net_income, diluted_eps]
      - name: issue_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MISSING_FILING_METADATA, UNSUPPORTED_FORM, MISSING_REPORT_DATE, NO_ELIGIBLE_METRIC, METRIC_VALUE_CONFLICT, METRIC_ACCURACY_UNRESOLVED]
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ERROR, WARNING]
      - name: report_date
        description: Verified date when available; null is allowed.
      - name: period_start
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: period_end
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: source_occurrence_ids
        description: Eligible ambiguity IDs in representative order, or a typed empty array for filing and metric problems.
        data_tests: [not_null]
      - name: details
        data_tests: [not_null]

  - name: int_reported_balance_sheet_metrics
    description: One agreed reported total-assets, total-liabilities or cash-and-equivalents value per CIK, accession, metric and reported instant; all supporting occurrences remain traceable.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_financial_metric_candidates')
                field: source_occurrence_id
      - name: value_decimal
        description: Exact representative DECIMAL(38,18), selected only after every eligible value and accuracy attribute agrees.
        data_tests: [not_null]
      - name: supporting_occurrence_ids
        description: All eligible IDs ordered by concept priority, source ordinal and occurrence ID, including the representative.
        data_tests: [not_null]
      - name: supporting_occurrence_count
        data_tests: [not_null]
      - name: period_label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reported_instant]
      - name: selection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SINGLE_ELIGIBLE_OCCURRENCE, AGREEING_ELIGIBLE_OCCURRENCES]
      - name: selection_rule_version
        description: Version of the eligibility, agreement and representative rules.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: form
        description: Verified form; original and amended accessions stay separate.
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: report_date
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [total_assets, total_liabilities, cash_and_equivalents]
      - name: period_instant
        description: Reported instant matching the verified report date.
        data_tests: [not_null]
  - name: int_balance_sheet_metric_selection_issues
    description: One precedence-ordered filing and metric problem or one ambiguity per exact eligible balance-sheet instant; excluded candidates remain inspectable.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [total_assets, total_liabilities, cash_and_equivalents]
      - name: issue_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MISSING_FILING_METADATA, UNSUPPORTED_FORM, MISSING_REPORT_DATE, NO_ELIGIBLE_METRIC, METRIC_VALUE_CONFLICT, METRIC_ACCURACY_UNRESOLVED]
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ERROR, WARNING]
      - name: report_date
        description: Verified date when available; null is allowed.
      - name: period_instant
        description: Ambiguous reported instant; null for filing-level issues.
      - name: source_occurrence_ids
        description: Eligible ambiguity IDs in representative order, or a typed empty array for filing and metric problems.
