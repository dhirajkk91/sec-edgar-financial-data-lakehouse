  - name: fct_financial_metrics
    description: >-
      Financial fact view assembled without calculations or deduplication from eligible classified reported rows
      and both successful derived-quarter views. Grain is (cik, accession_number, metric_code, period_kind,
      period_start, period_end, period_instant), including nullable boundaries; original and amended accessions
      remain independent. Reported evidence and derived dual-input evidence have origin-specific nullability.
    columns:
      - name: cik
        data_type: VARCHAR
        description: Preserved input cik.
        data_tests:
          - not_null
      - name: accession_number
        data_type: VARCHAR
        description: Preserved input accession number.
        data_tests:
          - not_null
      - name: metric_code
        data_type: VARCHAR
        description: Preserved input metric code.
        data_tests:
          - not_null
      - name: form
        data_type: VARCHAR
        description: Preserved input form.
        data_tests:
          - not_null
      - name: filing_date
        data_type: DATE
        description: Preserved input filing date.
        data_tests:
          - not_null
      - name: report_date
        data_type: DATE
        description: Preserved input report date.
        data_tests:
          - not_null
      - name: fiscal_year_focus
        data_type: INTEGER
        description: Reported fiscal year or preserved derived fiscal year; may be unresolved for a reported instant.
      - name: fiscal_period_focus
        data_type: VARCHAR
        description: Reported fiscal focus or preserved derived focus, including Q4; may be unresolved for a reported instant.
      - name: period_kind
        data_type: VARCHAR
        description: Preserved input period kind.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["duration", "instant"]
      - name: period_start
        data_type: DATE
        description: Duration start copied from its input; null for instant rows.
      - name: period_end
        data_type: DATE
        description: Duration end copied from its input; null for instant rows.
      - name: period_instant
        data_type: DATE
        description: Instant date copied from its input; null for duration rows.
      - name: period_label
        data_type: VARCHAR
        description: Reported classification (annual, quarter, year_to_date, instant), or the preserved derived_quarter label.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["annual", "quarter", "year_to_date", "instant", "derived_quarter"]
      - name: value_origin
        data_type: VARCHAR
        description: reported or derived; controls the evidence and rule-version requirements.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["reported", "derived"]
      - name: value_decimal
        data_type: DECIMAL(38,18)
        description: Exact input DECIMAL(38,18), without recalculation or sign changes.
        data_tests:
          - not_null
      - name: unit_expression
        data_type: VARCHAR
        description: Original input unit expression, including USD/share for reported diluted EPS.
        data_tests:
          - not_null
      - name: selection_rule_version
        data_type: VARCHAR
        description: Reported-only selection rule version; required for reported rows, null for derived rows. Tagged evidence for derived inputs is accessible through their occurrence IDs.
      - name: period_rule_version
        data_type: VARCHAR
        description: Reported-only period rule version; required for reported rows, null for derived rows. Tagged evidence for derived inputs is accessible through their occurrence IDs.
      - name: derivation_rule_version
        data_type: VARCHAR
        description: Preserved derivation rule version; required for derived rows, null for reported rows.
      - name: derivation_method
        data_type: VARCHAR
        description: Preserved derivation method; required for derived rows, null for reported rows.
      - name: concept_namespace
        data_type: VARCHAR
        description: Reported-only concept namespace; required for reported rows, null for derived rows. Tagged evidence for derived inputs is accessible through their occurrence IDs.
      - name: concept_local_name
        data_type: VARCHAR
        description: Reported-only concept local name; required for reported rows, null for derived rows. Tagged evidence for derived inputs is accessible through their occurrence IDs.
      - name: raw_value
        data_type: VARCHAR
        description: Reported-only raw value; required for reported rows, null for derived rows. Tagged evidence for derived inputs is accessible through their occurrence IDs.
      - name: current_source_occurrence_id
        data_type: VARCHAR
        description: Primary occurrence ID for the reported value or the current input of a derived quarter.
        data_tests:
          - not_null
      - name: current_source_document_name
        data_type: VARCHAR
        description: Source document name for the reported value or the current input of a derived quarter.
        data_tests:
          - not_null
      - name: current_source_sha256
        data_type: VARCHAR
        description: Source document checksum for the reported value or the current input of a derived quarter.
        data_tests:
          - not_null
      - name: current_value_decimal
        data_type: DECIMAL(38,18)
        description: Selected reported value, or the current cumulative input value for a derived row.
        data_tests:
          - not_null
      - name: current_supporting_occurrence_ids
        data_type: VARCHAR[]
        description: Complete ordered supporting occurrence IDs of the reported or current derived input.
        data_tests:
          - not_null
      - name: previous_accession_number
        data_type: VARCHAR
        description: Predecessor filing accession; required for derived rows, null for reported rows.
      - name: previous_source_occurrence_id
        data_type: VARCHAR
        description: Predecessor primary occurrence ID; required for derived rows, null for reported rows.
      - name: previous_source_document_name
        data_type: VARCHAR
        description: Predecessor source document name; required for derived rows, null for reported rows.
      - name: previous_source_sha256
        data_type: VARCHAR
        description: Predecessor source document checksum; required for derived rows, null for reported rows.
      - name: previous_value_decimal
        data_type: DECIMAL(38,18)
        description: Exact predecessor cumulative value; required for derived rows, null for reported rows.
      - name: previous_supporting_occurrence_ids
        data_type: VARCHAR[]
        description: Complete ordered previous-input IDs for derived rows; typed empty VARCHAR list for reported rows.
        data_tests:
          - not_null
      - name: cumulative_period_start
        data_type: DATE
        description: Preserved common cumulative start for derived rows; null for reported rows.
      - name: previous_period_end
        data_type: DATE
        description: Preserved predecessor end for derived rows; null for reported rows.
      - name: current_decimals
        data_type: VARCHAR
        description: Preserved input current decimals; independently nullable. Previous accuracy is null for reported rows; no derived accuracy is invented.
      - name: current_precision
        data_type: VARCHAR
        description: Preserved input current precision; independently nullable. Previous accuracy is null for reported rows; no derived accuracy is invented.
      - name: previous_decimals
        data_type: VARCHAR
        description: Preserved input previous decimals; independently nullable. Previous accuracy is null for reported rows; no derived accuracy is invented.
      - name: previous_precision
        data_type: VARCHAR
        description: Preserved input previous precision; independently nullable. Previous accuracy is null for reported rows; no derived accuracy is invented.

  - name: metric_quality_issues
    description: >-
      Unified view of six dedicated issue views and reported rows with non-null period_issue_code.
      It preserves upstream occurrences and ordered evidence with UNION ALL; repeated records are valid
      and no uniqueness is imposed. Selection, classification and derivation retain stage-specific nullability.
      Classification uses the existing critical-metric severity profile without changing financial or filing-status behavior.
    columns:
      - name: cik
        data_type: VARCHAR
        description: Company Central Index Key preserved from the upstream issue.
        data_tests:
          - not_null
      - name: accession_number
        data_type: VARCHAR
        description: Upstream filing accession; original and amended accessions remain separate.
        data_tests:
          - not_null
      - name: metric_code
        data_type: VARCHAR
        description: Canonical upstream metric code; supplemental and future metrics are retained.
        data_tests:
          - not_null
      - name: issue_stage
        data_type: VARCHAR
        description: selection, period_classification or derivation; identifies the upstream policy stage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["selection", "period_classification", "derivation"]
      - name: source_model
        data_type: VARCHAR
        description: Exact upstream model name without a schema prefix.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["int_revenue_selection_issues", "int_income_metric_selection_issues", "int_balance_sheet_metric_selection_issues", "int_cash_flow_metric_selection_issues", "int_reported_financial_periods", "int_quarterly_cash_flow_derivation_issues", "int_q4_financial_metric_derivation_issues"]
      - name: issue_code
        data_type: VARCHAR
        description: Preserved selection/derivation issue code or classified period_issue_code.
        data_tests:
          - not_null
      - name: severity
        data_type: VARCHAR
        description: Preserved upstream severity, except classification issues use ERROR for revenue, net_income, diluted_eps, total_assets and total_liabilities; WARNING otherwise. No filing status is computed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ERROR", "WARNING"]
      - name: report_date
        data_type: DATE
        description: Verified upstream report date when available; may be null for filing-level issues.
      - name: period_start
        data_type: DATE
        description: Available selection/classification duration start; null for instant selection and all derivation issues.
      - name: period_end
        data_type: DATE
        description: Available selection/classification duration end; null for instant selection and all derivation issues.
      - name: period_instant
        data_type: DATE
        description: Available balance-sheet selection/classification instant; null for duration selection and all derivation issues.
      - name: fiscal_year_focus
        data_type: INTEGER
        description: Available classification/derivation fiscal year; null for selection issues and unresolved classification metadata.
      - name: fiscal_period_focus
        data_type: VARCHAR
        description: Available classification/derivation focus, preserving Q4 calculation focus; null for selection or unresolved classification metadata.
      - name: current_source_occurrence_id
        data_type: VARCHAR
        description: Classification primary occurrence or derivation current input; null for selection issues.
      - name: source_occurrence_ids
        data_type: VARCHAR[]
        description: Complete ordered selection evidence or classification supporting IDs; one-element current-input list for derivation. Non-null, including empty upstream selection evidence.
        data_tests:
          - not_null
      - name: previous_source_occurrence_ids
        data_type: VARCHAR[]
        description: Complete ordered derivation candidate IDs, including empty missing-predecessor evidence; typed empty list for selection and classification.
        data_tests:
          - not_null
      - name: details
        data_type: VARCHAR
        description: Exact upstream issue details or period_classification_reason; never parsed or rewritten.
        data_tests:
          - not_null

  - name: dim_filings
    description: >-
      One dashboard summary per active (cik, accession_number). Left joins preserve filings with unavailable metadata
      or no selected financial rows. Metrics and issues are aggregated separately; metrics match the exact active source.
      Fiscal metadata requires agreement with active source and verified discovery lineage. Gold coverage and quality
      are summary fields only and remain independent of Silver processing and publication statuses.
    columns:
      - name: cik
        data_type: VARCHAR
        description: "Company Central Index Key from active Silver; part of the summary grain."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_silver_active_filings')
                field: cik
      - name: accession_number
        data_type: VARCHAR
        description: "Active filing accession; original and amended accessions remain independent."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_silver_active_filings')
                field: accession_number
      - name: form
        data_type: VARCHAR
        description: "Verified filing form when metadata is available; no form is inferred."
      - name: filing_date
        data_type: DATE
        description: "Verified filing date; null without available filing metadata."
      - name: report_date
        data_type: DATE
        description: "Verified reporting date; null when unavailable."
      - name: primary_document
        data_type: VARCHAR
        description: "Verified primary filing document; null when metadata is unavailable."
      - name: is_amendment
        data_type: BOOLEAN
        description: "Exact form suffix /A; null when form is unavailable. No amendment relationship is inferred."
      - name: fiscal_year_focus
        data_type: INTEGER
        description: "Independently resolved fiscal year from consistent active-source fiscal metadata; otherwise null."
      - name: fiscal_period_focus
        data_type: VARCHAR
        description: "Independently resolved reported fiscal focus from consistent fiscal metadata; otherwise null."
      - name: document_period_end_date
        data_type: DATE
        description: "Fiscal document end from consistent fiscal metadata; never inferred from report_date."
      - name: fiscal_metadata_status
        data_type: VARCHAR
        description: "Preserved extraction status of consistently attached fiscal metadata, including PARTIAL; otherwise null."
      - name: fiscal_extraction_version
        data_type: VARCHAR
        description: "Preserved fiscal extraction version; supported-version filtering belongs to the staging view."
      - name: metadata_run_id
        data_type: VARCHAR
        description: "Verified filing metadata discovery run; null when filing metadata is unavailable."
      - name: submissions_sha256
        data_type: VARCHAR
        description: "Verified submissions checksum from filing metadata; null when unavailable."
      - name: source_document_name
        data_type: VARCHAR
        description: "Preserved active Silver source document name."
        data_tests:
          - not_null
      - name: source_sha256
        data_type: VARCHAR
        description: "Preserved active Silver source sha256."
        data_tests:
          - not_null
      - name: silver_status
        data_type: VARCHAR
        description: "Preserved active Silver silver status."
        data_tests:
          - not_null
      - name: parser_version
        data_type: VARCHAR
        description: "Preserved active Silver parser version."
        data_tests:
          - not_null
      - name: schema_version
        data_type: VARCHAR
        description: "Preserved active Silver schema version."
        data_tests:
          - not_null
      - name: activation_run_id
        data_type: VARCHAR
        description: "Preserved active Silver activation run id."
        data_tests:
          - not_null
      - name: activated_at
        data_type: TIMESTAMPTZ
        description: "Preserved active Silver activated at."
        data_tests:
          - not_null
      - name: version_path
        data_type: VARCHAR
        description: "Preserved active Silver version path."
        data_tests:
          - not_null
      - name: publication_path
        data_type: VARCHAR
        description: "Preserved active Silver publication path."
        data_tests:
          - not_null
      - name: publication_sha256
        data_type: VARCHAR
        description: "Preserved active Silver publication sha256."
        data_tests:
          - not_null
      - name: accepted_fact_count
        data_type: BIGINT
        description: "Preserved active Silver accepted_count as BIGINT; defaults to zero only when unavailable."
        data_tests:
          - not_null
      - name: dimension_count
        data_type: BIGINT
        description: "Preserved active Silver dimension_count as BIGINT; defaults to zero only when unavailable."
        data_tests:
          - not_null
      - name: rejected_fact_count
        data_type: BIGINT
        description: "Preserved active Silver rejected_count as BIGINT; defaults to zero only when unavailable."
        data_tests:
          - not_null
      - name: candidate_fact_count
        data_type: BIGINT
        description: "Preserved active Silver candidate_count as BIGINT; defaults to zero only when unavailable."
        data_tests:
          - not_null
      - name: financial_metric_row_count
        data_type: BIGINT
        description: "All financial rows matching the active CIK, accession, source document and checksum; zero if absent."
        data_tests:
          - not_null
      - name: reported_metric_row_count
        data_type: BIGINT
        description: "Matched financial rows with value_origin reported; zero if absent."
        data_tests:
          - not_null
      - name: derived_metric_row_count
        data_type: BIGINT
        description: "Matched financial rows with value_origin derived; zero if absent."
        data_tests:
          - not_null
      - name: distinct_metric_count
        data_type: BIGINT
        description: "Distinct metric codes across matched reported and derived rows."
        data_tests:
          - not_null
      - name: present_critical_metric_count
        data_type: BIGINT
        description: "Distinct required metrics covered by reported annual/quarter income or instant balances on report_date; at most five."
        data_tests:
          - not_null
      - name: missing_critical_metric_codes
        data_type: VARCHAR[]
        description: "Non-null critical codes absent from the form-specific profile, in ascending lexical order; derived and YTD income do not substitute."
        data_tests:
          - not_null
      - name: quality_issue_count
        data_type: BIGINT
        description: "All existing issue occurrences for CIK and accession, retaining duplicates and aggregating separately from metrics."
        data_tests:
          - not_null
      - name: error_issue_count
        data_type: BIGINT
        description: "Existing ERROR issue occurrences for CIK and accession."
        data_tests:
          - not_null
      - name: warning_issue_count
        data_type: BIGINT
        description: "Existing WARNING issue occurrences; warnings alone do not reduce Gold quality."
        data_tests:
          - not_null
      - name: gold_quality_status
        data_type: VARCHAR
        description: "FAILED for metadata/form/no-metric failures, PARTIAL for missing critical metrics or ERROR issues, otherwise COMPLETE; independent of Silver status."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FAILED", "PARTIAL", "COMPLETE"]
      - name: gold_quality_reason
        data_type: VARCHAR
        description: "First applicable ordered rule: missing metadata, missing report date, unsupported form, no metrics, missing critical metrics, metric errors, critical metrics present."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["MISSING_FILING_METADATA", "MISSING_REPORT_DATE", "UNSUPPORTED_FORM", "NO_SELECTED_METRICS", "MISSING_CRITICAL_METRICS", "METRIC_ERRORS", "CRITICAL_METRICS_PRESENT"]
      - name: quality_rule_version
        data_type: VARCHAR
        description: "Summary policy version 1; does not change publication, company-run or catalog statuses."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1"]

seeds:
  - name: metric_concept_map
    description: Approved revenue, income, balance-sheet and cash-flow concept mappings; one row per metric, namespace prefix, concept and period kind. Priority is evidence for later selection.
    columns:
      - name: metric_code
        data_tests: [not_null]
      - name: concept_namespace_prefix
        data_tests: [not_null]
      - name: concept_local_name
        data_tests: [not_null]
      - name: concept_priority
        data_tests: [not_null]
      - name: expected_period_kind
        data_tests: [not_null]
