version: 2
sources:
  - name: silver
    description: Verified active Silver catalog; dbt reads these existing relations.
    database: "{{ target.database }}"
    schema: silver
    tables:
      - name: active_filings
        description: One verified active Silver publication per filing.
      - name: facts
        description: One accepted numeric fact occurrence from an active filing.
      - name: fact_dimensions
        description: One dimension attached to an accepted fact occurrence.
      - name: rejected_facts
        description: One rejected numeric candidate with its source and reason.
      - name: filing_metadata
        description: Verified SEC metadata and first accepted discovery provenance per filing.
      - name: filing_fiscal_metadata
        description: Persisted fiscal DEI extraction evidence, including historical sources.
