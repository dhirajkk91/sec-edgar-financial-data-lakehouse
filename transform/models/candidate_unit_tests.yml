- name: typed_empty_inputs_produce_no_candidates
  model: int_financial_metric_candidates
  description: Empty typed inputs preserve the SQL shape without manufacturing candidates.
  given:
  - input: ref('stg_silver_facts')
    format: sql
    rows: |
      select
          cast(null as VARCHAR) as source_occurrence_id,
          cast(null as VARCHAR) as cik,
          cast(null as VARCHAR) as accession_number,
          cast(null as VARCHAR) as source_document_name,
          cast(null as VARCHAR) as source_sha256,
          cast(null as BIGINT) as source_ordinal,
          cast(null as VARCHAR) as processing_run_id,
          cast(null as VARCHAR) as parser_version,
          cast(null as VARCHAR) as schema_version,
          cast(null as VARCHAR) as concept_namespace,
          cast(null as VARCHAR) as concept_local_name,
          cast(null as VARCHAR) as raw_value,
          cast(null as DECIMAL(38,18)) as value_decimal,
          cast(null as BOOLEAN) as is_nil,
          cast(null as VARCHAR) as decimals,
          cast(null as VARCHAR) as precision,
          cast(null as VARCHAR) as unit_ref,
          cast(null as VARCHAR) as unit_expression,
          cast(null as VARCHAR) as unit_xml,
          cast(null as VARCHAR) as context_ref,
          cast(null as VARCHAR) as context_xml,
          cast(null as VARCHAR) as entity_scheme,
          cast(null as VARCHAR) as entity_identifier,
          cast(null as VARCHAR) as period_kind,
          cast(null as DATE) as period_start,
          cast(null as DATE) as period_end,
          cast(null as DATE) as period_instant
      where false
  - input: ref('stg_silver_active_filings')
    format: sql
    rows: |
      select
          cast(null as VARCHAR) as cik,
          cast(null as VARCHAR) as accession_number,
          cast(null as VARCHAR) as source_document_name,
          cast(null as VARCHAR) as source_sha256,
          cast(null as VARCHAR) as silver_status,
          cast(null as VARCHAR) as parser_version,
          cast(null as VARCHAR) as schema_version,
          cast(null as VARCHAR) as activation_run_id,
          cast(null as TIMESTAMP WITH TIME ZONE) as activated_at,
          cast(null as VARCHAR) as version_path,
          cast(null as VARCHAR) as publication_path,
          cast(null as VARCHAR) as publication_sha256,
          cast(null as BIGINT) as accepted_count,
          cast(null as BIGINT) as dimension_count,
          cast(null as BIGINT) as rejected_count,
          cast(null as BIGINT) as candidate_count
      where false
  - input: ref('stg_silver_fact_dimensions')
    format: sql
    rows: |
      select
          cast(null as VARCHAR) as source_occurrence_id,
          cast(null as VARCHAR) as axis_namespace,
          cast(null as VARCHAR) as axis_name,
          cast(null as VARCHAR) as member_kind,
          cast(null as VARCHAR) as member_value,
          cast(null as VARCHAR) as typed_member_xml,
          cast(null as VARCHAR) as context_location
      where false
  - input: ref('metric_concept_map')
    format: sql
    rows: |
      select
          cast(null as VARCHAR) as metric_code,
          cast(null as VARCHAR) as concept_namespace_prefix,
          cast(null as VARCHAR) as concept_local_name,
          cast(null as INTEGER) as concept_priority,
          cast(null as VARCHAR) as expected_period_kind
      where false
  expect:
    rows: []
