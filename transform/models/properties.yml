version: 2
models:
  - name: stg_silver_active_filings
    description: Unmodified Silver publication metadata; one row per active filing.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: source_document_name
        data_tests: [not_null]
      - name: source_sha256
        data_tests: [not_null]
  - name: stg_silver_facts
    description: Unmodified accepted Silver facts; one row per source occurrence.
    columns:
      - name: source_occurrence_id
        data_tests: [not_null, unique]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: source_document_name
        data_tests: [not_null]
      - name: source_sha256
        data_tests: [not_null]
  - name: stg_silver_fact_dimensions
    description: Unmodified Silver dimensions; one row per dimension on an occurrence.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_silver_facts')
                field: source_occurrence_id
  - name: int_financial_metric_candidates
    description: One active Silver mapped financial metric occurrence per row; preserves comparative periods and dimensions without selecting a winner.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_silver_facts')
                field: source_occurrence_id
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: source_document_name
        data_tests: [not_null]
      - name: source_sha256
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [revenue, net_income, diluted_eps, total_assets, total_liabilities, cash_and_equivalents, operating_cash_flow, capital_expenditures]
      - name: period_kind
        description: Lowercase period label matched exactly to the concept map.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [duration, instant]
      - name: value_decimal
        description: Reported Silver value preserved as DECIMAL(38,18).
        data_tests: [not_null]
      - name: dimension_count
        description: Dimension count for this occurrence; zero when none are present.
        data_tests: [not_null]
      - name: has_dimensions
        description: Indicates dimensional evidence, without identifying company totals.
        data_tests: [not_null]
      - name: duration_days
        description: Inclusive calendar days; null if either boundary is absent.
      - name: is_usd
        description: True only for the exact simple ISO 4217 USD unit expression.

  - name: stg_silver_filing_metadata
    description: One row per currently active filing with verified stored SEC metadata.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: form
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: primary_document
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: run_record_path
        data_tests: [not_null]
      - name: submissions_path
        data_tests: [not_null]
      - name: submissions_url
        data_tests: [not_null]
      - name: submissions_retrieved_at
        data_tests: [not_null]
      - name: submissions_size_bytes
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]

  - name: int_reported_revenue
    description: One agreed reported revenue value per CIK, accession, metric and exact duration; all supporting occurrences remain traceable.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_financial_metric_candidates')
                field: source_occurrence_id
      - name: value_decimal
        description: Exact representative DECIMAL(38,18), selected only after every eligible value and accuracy attribute agrees.
        data_tests: [not_null]
      - name: supporting_occurrence_ids
        description: All eligible IDs ordered by concept priority, source ordinal and occurrence ID, including the representative.
        data_tests: [not_null]
      - name: supporting_occurrence_count
        data_tests: [not_null]
      - name: period_label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reported_duration]
      - name: selection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SINGLE_ELIGIBLE_OCCURRENCE, AGREEING_ELIGIBLE_OCCURRENCES]
      - name: selection_rule_version
        description: Version of the eligibility, agreement and representative rules.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1']
      - name: form
        description: Verified form; original and amended accessions stay separate.
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: report_date
        data_tests: [not_null]
      - name: metadata_run_id
        data_tests: [not_null]
      - name: submissions_sha256
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests: [not_null]
      - name: period_start
        data_tests: [not_null]
      - name: period_end
        data_tests: [not_null]
  - name: int_revenue_selection_issues
    description: One precedence-ordered filing problem or one ambiguity per exact eligible revenue duration; excluded candidates remain inspectable.
    columns:
      - name: cik
        data_tests: [not_null]
      - name: accession_number
        data_tests: [not_null]
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [revenue]
      - name: issue_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MISSING_FILING_METADATA, UNSUPPORTED_FORM, MISSING_REPORT_DATE, NO_ELIGIBLE_REVENUE, REVENUE_VALUE_CONFLICT, REVENUE_ACCURACY_UNRESOLVED]
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ERROR, WARNING]
      - name: report_date
        description: Verified date when available; null is allowed.
      - name: period_start
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: period_end
        description: Exact ambiguous period boundary; null for filing-level issues.
      - name: source_occurrence_ids
        description: Eligible ambiguity IDs in representative order, or a typed empty array for filing problems.
        data_tests: [not_null]
      - name: details
        data_tests: [not_null]

  - name: int_reported_income_metrics
    description: One agreed reported net-income or diluted-EPS value per CIK, accession, metric and exact duration; all supporting occurrences remain traceable.
    columns:
      - name: source_occurrence_id
        data_tests:
          - not_null
          - relationships:
