name: sec_edgar_gold
version: "1.0.0"
config-version: 2
profile: sec_edgar_gold

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]

models:
  sec_edgar_gold:
    # Gold results are stored as tables so tests and the dashboard read computed rows
    # instead of re-running the whole chain over Silver every time.
    +materialized: table
    staging:
      # Staging stays a thin view over Silver Parquet; DuckDB keeps no second copy of facts.
      +materialized: view

seeds:
  sec_edgar_gold:
    metric_concept_map:
      +column_types:
        metric_code: VARCHAR
        concept_namespace_prefix: VARCHAR
        concept_local_name: VARCHAR
        concept_priority: INTEGER
        expected_period_kind: VARCHAR
