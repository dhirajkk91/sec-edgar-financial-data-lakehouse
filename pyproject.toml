[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[project]
name = "sec-edgar-financial-data-lakehouse"
version = "0.1.0"
description = "Ingests, validates, and processes SEC EDGAR filings and XBRL financial data."
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5,<1.6",
    "httpx>=0.28.1",
    "pytz>=2026.4",
]

[project.scripts]
sec-edgar = "sec_edgar_lakehouse.cli:main"

[tool.uv.build-backend]
module-name = "sec_edgar_lakehouse"

[dependency-groups]
dashboard = [
    "streamlit>=1.65,<2",
]

dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

dbt = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[tool.ruff]
# The pipeline runs on Python 3.14, but the source stays valid from 3.12 up so the
# read-only dashboard can run on hosts that do not offer 3.14 yet.
target-version = "py312"
